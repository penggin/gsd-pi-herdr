name: Pi upstream freshness audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 3"
  pull_request:
    paths:
      - ".github/workflows/pi-upstream-audit.yml"
      - "scripts/audit-pi-upstream.mjs"
      - "scripts/pi-upstream.json"
      - "scripts/__tests__/pi-upstream-audit.test.mjs"
      - "scripts/__tests__/pi-upstream-audit-workflow.test.mjs"
      - "docs/dev/pi-upstream.md"
      - "docs/dev/pi-upstream-audit-*.md"

permissions:
  contents: read

concurrency:
  group: pi-upstream-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: read-only upstream ref audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Verify audit parser and fail-closed policy
        run: node --test scripts/__tests__/pi-upstream-audit.test.mjs scripts/__tests__/pi-upstream-audit-workflow.test.mjs

      - name: Compare reviewed and current upstream refs
        id: audit
        shell: bash
        run: |
          mkdir -p build/pi-upstream-audit
          set +e
          node scripts/audit-pi-upstream.mjs --markdown \
            > build/pi-upstream-audit/report.md \
            2> build/pi-upstream-audit/stderr.log
          status=$?
          set -e
          cat build/pi-upstream-audit/report.md
          cat build/pi-upstream-audit/stderr.log >&2
          echo "exit-code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Publish audit summary
        if: always()
        shell: bash
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit-code }}
        run: |
          {
            echo "## Pi upstream freshness audit"
            echo
            echo "Audit exit code: \`${AUDIT_EXIT_CODE:-not-started}\`"
            echo
            if [ -s build/pi-upstream-audit/report.md ]; then
              cat build/pi-upstream-audit/report.md
            fi
            if [ -s build/pi-upstream-audit/stderr.log ]; then
              echo
              echo "### Diagnostic"
              echo '```text'
              cat build/pi-upstream-audit/stderr.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pi-upstream-audit-${{ github.run_id }}
          path: build/pi-upstream-audit/
          if-no-files-found: error
          retention-days: 30
